<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Audit-first WSL AI migration workflow</title>
  <desc id="desc">Five controlled stages: audit, decide, isolate, migrate, and verify.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#636C76"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="8" fill="#F6F8FA"/>
  <text x="48" y="58" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="38" font-weight="700" letter-spacing="0">ONE CONTROLLED MIGRATION</text>
  <text x="48" y="88" fill="#636C76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="0">READ-ONLY FIRST / EXPLICIT DECISIONS / VERIFIABLE RESULT</text>

  <g stroke="#636C76" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M248 174 H274"/>
    <path d="M472 174 H498"/>
    <path d="M696 174 H722"/>
    <path d="M920 174 H946"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" letter-spacing="0">
    <g transform="translate(48 116)">
      <rect width="200" height="116" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
      <rect width="200" height="7" fill="#58A6FF"/>
      <text x="16" y="45" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">01</text>
      <text x="16" y="91" fill="#1F2328" font-size="36" font-weight="700">AUDIT</text>
    </g>
    <g transform="translate(272 116)">
      <rect width="200" height="116" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
      <rect width="200" height="7" fill="#D29922"/>
      <text x="16" y="45" fill="#9A6700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">02</text>
      <text x="16" y="91" fill="#1F2328" font-size="36" font-weight="700">DECIDE</text>
    </g>
    <g transform="translate(496 116)">
      <rect width="200" height="116" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
      <rect width="200" height="7" fill="#E95420"/>
      <text x="16" y="45" fill="#C54117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">03</text>
      <text x="16" y="91" fill="#1F2328" font-size="36" font-weight="700">ISOLATE</text>
    </g>
    <g transform="translate(720 116)">
      <rect width="200" height="116" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
      <rect width="200" height="7" fill="#8250DF"/>
      <text x="16" y="45" fill="#8250DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">04</text>
      <text x="16" y="91" fill="#1F2328" font-size="36" font-weight="700">MIGRATE</text>
    </g>
    <g transform="translate(944 116)">
      <rect width="208" height="116" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
      <rect width="208" height="7" fill="#3FB950"/>
      <text x="16" y="45" fill="#1A7F37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">05</text>
      <text x="16" y="91" fill="#1F2328" font-size="36" font-weight="700">VERIFY</text>
    </g>
  </g>

  <path d="M48 264 H1152" stroke="#D0D7DE"/>
  <text x="48" y="288" fill="#636C76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="0">NATIVE COMMAND ORIGINS / NO AUTOMATIC WINDOWS PATH / EXPLICIT INTEROP STILL WORKS</text>
</svg>
