<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Bootstrap WSL AI Dev</title>
  <desc id="desc">A Codex skill that creates a native WSL AI toolchain, blocks automatic Windows PATH import, and preserves explicit Windows interoperability.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#58A6FF"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="8" fill="#0B0D10"/>
  <path d="M36 34 H1164 M36 366 H1164" stroke="#2B313A" stroke-width="1"/>
  <path d="M731 34 V366" stroke="#2B313A" stroke-width="1"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" letter-spacing="0">
    <text x="58" y="72" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">CODEX SKILL / WINDOWS 11 + WSL 2</text>
    <text x="56" y="154" fill="#F0F3F6" font-size="62" font-weight="700">BOOTSTRAP WSL</text>
    <text x="56" y="222" fill="#E95420" font-size="62" font-weight="700">AI DEV</text>
    <text x="59" y="273" fill="#C9D1D9" font-size="22">Native AI tools in Ubuntu.</text>
    <text x="59" y="307" fill="#C9D1D9" font-size="22">Explicit Windows interop, without PATH leakage.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B949E">
      <circle cx="63" cy="342" r="4" fill="#58A6FF"/>
      <text x="77" y="348">AUDIT</text>
      <circle cx="160" cy="342" r="4" fill="#E95420"/>
      <text x="174" y="348">ISOLATE</text>
      <circle cx="283" cy="342" r="4" fill="#D29922"/>
      <text x="297" y="348">MIGRATE</text>
      <circle cx="410" cy="342" r="4" fill="#3FB950"/>
      <text x="424" y="348">VERIFY</text>
    </g>
  </g>

  <g id="system-boundary" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" letter-spacing="0">
    <rect x="770" y="48" width="370" height="100" rx="6" fill="#141820" stroke="#303844"/>
    <rect x="770" y="48" width="6" height="100" fill="#58A6FF"/>
    <text x="800" y="94" fill="#58A6FF" font-size="32" font-weight="700">WINDOWS 11</text>
    <text x="800" y="128" fill="#F0F3F6" font-size="22" font-weight="600">TOOLS + EXPLORER</text>

    <rect x="770" y="252" width="370" height="100" rx="6" fill="#171613" stroke="#3E372F"/>
    <rect x="770" y="252" width="6" height="100" fill="#E95420"/>
    <text x="800" y="298" fill="#E95420" font-size="32" font-weight="700">WSL UBUNTU</text>
    <text x="800" y="332" fill="#F0F3F6" font-size="22" font-weight="600">NATIVE AI TOOLCHAIN</text>

    <path d="M755 202 H1155" stroke="#4A5059" stroke-width="1"/>
    <rect x="870" y="188" width="230" height="28" fill="#0B0D10"/>
    <text x="882" y="208" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">appendWindowsPath=false</text>

    <path d="M828 149 V190" stroke="#F85149" stroke-width="2"/>
    <path d="M818 182 L838 202 M838 182 L818 202" stroke="#F85149" stroke-width="3"/>
    <text x="790" y="172" fill="#F85149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">AUTO PATH</text>
    <text x="794" y="231" fill="#8B949E" font-size="16">blocked</text>

    <path d="M1120 251 V153" stroke="#58A6FF" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="1028" y="235" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">EXPLICIT</text>
    <text x="965" y="176" fill="#C9D1D9" font-size="18">/mnt/c/.../cmd.exe</text>
  </g>
</svg>
