name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck -x scripts/*.sh tests/*.sh

      - name: Test WSL isolation renderer
        run: bash tests/test-configure-wsl-path-isolation.sh

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/audit-windows-ai-tools.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
